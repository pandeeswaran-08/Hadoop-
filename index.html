  <!-- React 18 Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- Procedural Sound FX Synthesizer ---
    let audioCtx = null;
    function playTechSound(type = 'click', soundEnabled = true) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const ctx = audioCtx;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(850, now);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'step') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(460, now);
          osc.frequency.exponentialRampToValueAtTime(700, now + 0.12);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'alert') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.linearRampToValueAtTime(170, now + 0.22);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      } catch (e) {
        console.warn('Audio not available:', e);
      }
    }

    // --- Component: Advanced 3D Gyroscopic Three.js Cluster ---
    function ThreeClusterAdvanced({ playSound }) {
      const mountRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container || typeof THREE === 'undefined') return;

        const width = container.clientWidth || window.innerWidth;
        const height = container.clientHeight || 520;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
        camera.position.set(0, 0, 90);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.innerHTML = '';
        container.appendChild(renderer.domElement);

        const clusterGroup = new THREE.Group();
        scene.add(clusterGroup);        // Gyroscopic Ring 1 (Inner Precision Ring - Pure White Wireframe)
        const ring1Geo = new THREE.TorusGeometry(12.5, 0.16, 16, 120);
        const ring1Mat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.75 });
        const ring1 = new THREE.Mesh(ring1Geo, ring1Mat);
        clusterGroup.add(ring1);

        // Gyroscopic Ring 2 (Orbital Meridian Ring - Silver Translucent)
        const ring2Geo = new THREE.TorusGeometry(17, 0.18, 16, 120);
        const ring2Mat = new THREE.MeshBasicMaterial({ color: 0xdddddd, transparent: true, opacity: 0.5 });
        const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
        ring2.rotation.x = Math.PI / 3.2;
        clusterGroup.add(ring2);

        // Gyroscopic Ring 3 (Outer Magnetic Horizon Ring - Platinum Wireframe)
        const ring3Geo = new THREE.TorusGeometry(22, 0.16, 16, 120);
        const ring3Mat = new THREE.MeshBasicMaterial({ color: 0xaaaaaa, wireframe: true, transparent: true, opacity: 0.45 });
        const ring3 = new THREE.Mesh(ring3Geo, ring3Mat);
        ring3.rotation.y = Math.PI / 4;
        clusterGroup.add(ring3);

        // Gyroscopic Ring 4 (Equatorial Latitude Ring - Thin Pure White Hairline)
        const ring4Geo = new THREE.TorusGeometry(27, 0.12, 16, 120);
        const ring4Mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 });
        const ring4 = new THREE.Mesh(ring4Geo, ring4Mat);
        ring4.rotation.z = Math.PI / 6;
        clusterGroup.add(ring4);

        // Master NameNode (Glowing White Icosahedron Cage + Obsidian Glass Core + Inner Diamond)
        const masterGeo = new THREE.IcosahedronGeometry(6.8, 2);
        const masterMat = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          wireframe: true,
          transparent: true,
          opacity: 0.95
        });
        const masterNode = new THREE.Mesh(masterGeo, masterMat);
        clusterGroup.add(masterNode);

        // Obsidian Core Sphere with Ultra-Sharp White Specular Sheen
        const coreGeo = new THREE.SphereGeometry(4.4, 32, 32);
        const coreMat = new THREE.MeshPhongMaterial({
          color: 0x050505,
          emissive: 0x181818,
          specular: 0xffffff,
          shininess: 160
        });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        clusterGroup.add(coreMesh);

        // Inner Sacred Geometry Diamond (Pulsing Octahedron)
        const diamondGeo = new THREE.OctahedronGeometry(2.6, 0);
        const diamondMat = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          wireframe: true,
          transparent: true,
          opacity: 0.85
        });
        const diamondMesh = new THREE.Mesh(diamondGeo, diamondMat);
        clusterGroup.add(diamondMesh);

        // Lighting (Monochrome Chiaroscuro Studio Setup)
        scene.add(new THREE.AmbientLight(0x222222));
        const pl1 = new THREE.PointLight(0xffffff, 3.0, 300);
        pl1.position.set(30, 45, 55);
        scene.add(pl1);
        const pl2 = new THREE.PointLight(0xaaaaaa, 2.0, 250);
        pl2.position.set(-30, -45, -55);
        scene.add(pl2);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.position.set(0, 50, 20);
        scene.add(dirLight);

        // 8 Worker DataNodes in 3D multi-planar orbits (Monochrome Chrome & Obsidian Nodes)
        const workerNodes = [];
        const packetMeshes = [];
        const workerCount = 8;
        const orbitRadius = 34;

        for (let i = 0; i < workerCount; i++) {
          const angle = (i / workerCount) * Math.PI * 2;
          const yOffset = Math.sin(i * 1.8) * 14;
          const wGeo = new THREE.SphereGeometry(2.4, 24, 24);
          const isChrome = i % 2 === 0;
          const wMat = new THREE.MeshStandardMaterial({
            color: isChrome ? 0xffffff : 0x151515,
            emissive: isChrome ? 0x222222 : 0x050505,
            roughness: isChrome ? 0.1 : 0.35,
            metalness: isChrome ? 0.95 : 0.8
          });
          const worker = new THREE.Mesh(wGeo, wMat);
          worker.position.set(Math.cos(angle) * orbitRadius, yOffset, Math.sin(angle) * orbitRadius);

          // Add a sleek white satellite ring around each worker node
          const satRingGeo = new THREE.TorusGeometry(3.6, 0.08, 8, 32);
          const satRingMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
          const satRing = new THREE.Mesh(satRingGeo, satRingMat);
          satRing.rotation.x = Math.PI / 2.5;
          worker.add(satRing);

          worker.userData = {
            angle,
            speed: 0.0016 + (i % 3) * 0.0006,
            radius: orbitRadius + (i % 2 === 0 ? 4 : -4),
            yBase: yOffset
          };
          clusterGroup.add(worker);
          workerNodes.push(worker);

          // Connecting Laser Ray (Pure White Laser)
          const lineGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0, 0),
            worker.position
          ]);
          const lineMat = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.45
          });
          const line = new THREE.Line(lineGeo, lineMat);
          clusterGroup.add(line);
          worker.userData.line = line;

          // Glowing Traveling Data Packet (Pure White Diamond Crystal)
          const pktGeo = new THREE.OctahedronGeometry(0.75, 0);
          const pktMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
          const pkt = new THREE.Mesh(pktGeo, pktMat);
          clusterGroup.add(pkt);
          packetMeshes.push({ mesh: pkt, worker, progress: Math.random() });
        }

        // Particle Galaxy Cloud (350 Monochromatic Star Points)
        const pCount = 350;
        const pGeo = new THREE.BufferGeometry();
        const pPositions = new Float32Array(pCount * 3);
        const pColors = new Float32Array(pCount * 3);

        for (let i = 0; i < pCount * 3; i += 3) {
          pPositions[i] = (Math.random() - 0.5) * 140;
          pPositions[i + 1] = (Math.random() - 0.5) * 100;
          pPositions[i + 2] = (Math.random() - 0.5) * 140;
          const lum = 0.75 + Math.random() * 0.25;
          pColors[i] = lum;
          pColors[i + 1] = lum;
          pColors[i + 2] = lum;
        }

        pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
        pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));
        const pMat = new THREE.PointsMaterial({ size: 1.8, vertexColors: true, transparent: true, opacity: 0.85 });
        const pCloud = new THREE.Points(pGeo, pMat);
        clusterGroup.add(pCloud);

        // Mouse Parallax & Shockwave physics (Double Concentric Pure White Rings)
        let targetRotX = 0;
        let targetRotY = 0;
        let shockwaveRadius = 0;
        let shockwaveActive = false;

        const shockRingGeo = new THREE.RingGeometry(1, 1.8, 60);
        const shockRingMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0 });
        const shockRing = new THREE.Mesh(shockRingGeo, shockRingMat);
        shockRing.rotation.x = Math.PI / 2;
        clusterGroup.add(shockRing);

        const shockRing2Geo = new THREE.RingGeometry(1.8, 2.3, 60);
        const shockRing2Mat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0 });
        const shockRing2 = new THREE.Mesh(shockRing2Geo, shockRing2Mat);
        shockRing2.rotation.x = Math.PI / 2;
        clusterGroup.add(shockRing2);

        const onMouseMove = (e) => {
          const rect = container.getBoundingClientRect();
          if (e.clientY >= rect.top && e.clientY <= rect.bottom) {
            const mx = ((e.clientX - rect.left) / width) * 2 - 1;
            const my = -(((e.clientY - rect.top) / height) * 2 - 1);
            targetRotY = mx * 0.7;
            targetRotX = my * 0.45;
          }
        };

        const onClick = () => {
          if (playSound) playSound('step');
          shockwaveRadius = 1;
          shockwaveActive = true;
          masterGeo.scale(1.25, 1.25, 1.25);
          setTimeout(() => masterGeo.scale(1 / 1.25, 1 / 1.25, 1 / 1.25), 180);
        };

        window.addEventListener('mousemove', onMouseMove);
        container.addEventListener('click', onClick);

        let animId;
        const clock = new THREE.Clock();

        const renderLoop = () => {
          animId = requestAnimationFrame(renderLoop);
          const time = clock.getElapsedTime();

          // Gyroscope Ring rotations (Smooth, cinematic speed)
          ring1.rotation.x = time * 0.18;
          ring1.rotation.y = time * 0.12;
          ring2.rotation.y = -time * 0.15;
          ring2.rotation.z = time * 0.09;
          ring3.rotation.z = time * 0.20;
          ring3.rotation.x = -time * 0.10;
          ring4.rotation.x = time * 0.08;
          ring4.rotation.y = -time * 0.14;

          // Main cluster inertia (Gentle idle drift)
          clusterGroup.rotation.y += (targetRotY - clusterGroup.rotation.y) * 0.05 + 0.0008;
          clusterGroup.rotation.x += (targetRotX - clusterGroup.rotation.x) * 0.05;

          // Master node pulse & Diamond spin (Calm pace)
          masterNode.rotation.y += 0.0035;
          diamondMesh.rotation.y = -time * 0.45;
          diamondMesh.rotation.z = time * 0.25;
          const scalePulse = 1 + Math.sin(time * 1.4) * 0.03;
          coreMesh.scale.set(scalePulse, scalePulse, scalePulse);

          // Worker Nodes orbit + line updates
          workerNodes.forEach((worker, idx) => {
            worker.userData.angle += worker.userData.speed;
            const x = Math.cos(worker.userData.angle) * worker.userData.radius;
            const z = Math.sin(worker.userData.angle) * worker.userData.radius;
            const y = worker.userData.yBase + Math.sin(time * 0.8 + idx) * 2.2;
            worker.position.set(x, y, z);

            if (worker.userData.line) {
              const pos = worker.userData.line.geometry.attributes.position.array;
              pos[3] = x; pos[4] = y; pos[5] = z;
              worker.userData.line.geometry.attributes.position.needsUpdate = true;
            }
          });

          // Traveling Data Packets along rays (Gentle streaming)
          packetMeshes.forEach(p => {
            p.progress += 0.0045;
            if (p.progress > 1) p.progress = 0;
            const target = p.worker.position;
            p.mesh.position.set(
              target.x * p.progress,
              target.y * p.progress,
              target.z * p.progress
            );
            p.mesh.rotation.x += 0.015;
            p.mesh.rotation.y += 0.015;
          });

          // Dual Shockwave ripple expansion on click
          if (shockwaveActive) {
            shockwaveRadius += 1.4;
            shockRing.scale.set(shockwaveRadius, shockwaveRadius, 1);
            shockRingMat.opacity = Math.max(0, 1 - shockwaveRadius / 50);
            shockRing2.scale.set(shockwaveRadius * 0.85, shockwaveRadius * 0.85, 1);
            shockRing2Mat.opacity = Math.max(0, 0.7 - (shockwaveRadius * 0.85) / 50);
            if (shockwaveRadius > 50) {
              shockwaveActive = false;
              shockRingMat.opacity = 0;
              shockRing2Mat.opacity = 0;
            }
          }

          pCloud.rotation.y = time * 0.009;
          renderer.render(scene, camera);
        };

        renderLoop();

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('mousemove', onMouseMove);
          container.removeEventListener('click', onClick);
          renderer.dispose();
        };
      }, [playSound]);

      return (
        <div
          ref={mountRef}
          className="absolute inset-0 w-full h-full pointer-events-auto cursor-grab active:cursor-grabbing opacity-90"
        />
      );
    }

    // --- Component: Relativistic Black Hole Canvas (shadcn black-hole.tsx) ---
    function BlackHoleCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        let isDisposed = false;
        let animId = 0;
        const ctx = canvas.getContext('2d', { alpha: false });
        if (!ctx) return;

        let width = (canvas.width = canvas.parentElement?.clientWidth || window.innerWidth);
        let height = (canvas.height = canvas.parentElement?.clientHeight || window.innerHeight);

        let dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);

        let mouseX = width / 2;
        let mouseY = height / 2;
        let targetTiltX = 0;
        let targetTiltY = 0;
        let currentTiltX = 0;
        let currentTiltY = 0;

        const particleCount = 1300;
        const particles = [];
        const minRadius = Math.min(width, height) * 0.12;
        const maxRadius = Math.min(width, height) * 0.46;

        for (let i = 0; i < particleCount; i++) {
          const rNorm = Math.pow(Math.random(), 0.65);
          const r = minRadius + rNorm * (maxRadius - minRadius);
          const baseSpeed = Math.sqrt(minRadius / r) * 0.014 + 0.0015;
          particles.push({
            r,
            theta: Math.random() * Math.PI * 2,
            speed: baseSpeed * (0.85 + Math.random() * 0.3),
            size: 0.6 + Math.random() * 1.8,
            lum: 0.4 + Math.random() * 0.6,
            z: (Math.random() - 0.5) * 28,
            radialSpeed: -0.015 - Math.random() * 0.035,
          });
        }

        const starCount = 200;
        const stars = [];
        for (let i = 0; i < starCount; i++) {
          stars.push({
            x: (Math.random() - 0.5) * width * 1.4,
            y: (Math.random() - 0.5) * height * 1.4,
            size: 0.5 + Math.random() * 1.4,
            alpha: 0.2 + Math.random() * 0.7,
          });
        }

        const onMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouseX = e.clientX - rect.left;
          mouseY = e.clientY - rect.top;
          targetTiltX = ((mouseX - width / 2) / width) * 0.35;
          targetTiltY = ((mouseY - height / 2) / height) * 0.25;
        };

        const onResize = () => {
          if (isDisposed || !canvas.parentElement) return;
          width = canvas.parentElement.clientWidth || window.innerWidth;
          height = canvas.parentElement.clientHeight || window.innerHeight;
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          ctx.scale(dpr, dpr);
        };

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('resize', onResize);

        let time = 0;

        const render = () => {
          if (isDisposed) return;
          animId = requestAnimationFrame(render);
          time += 0.007;

          currentTiltX += (targetTiltX - currentTiltX) * 0.05;
          currentTiltY += (targetTiltY - currentTiltY) * 0.05;

          const cx = width / 2;
          const cy = height / 2;
          const horizonR = Math.min(width, height) * 0.11;
          const photonSphereR = horizonR * 1.5;

          ctx.fillStyle = '#000000';
          ctx.fillRect(0, 0, width, height);

          // 1. Deflected background stars
          ctx.save();
          ctx.translate(cx, cy);
          for (let i = 0; i < stars.length; i++) {
            const s = stars[i];
            const dist = Math.hypot(s.x, s.y);
            if (dist < horizonR * 0.9) continue;

            const deflection = (photonSphereR * 25) / (dist + 30);
            const angle = Math.atan2(s.y, s.x);
            const bentDist = dist + deflection;
            const bx = Math.cos(angle) * bentDist;
            const by = Math.sin(angle) * bentDist;

            ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha * (0.8 + 0.2 * Math.sin(time * 2 + i))})`;
            ctx.beginPath();
            ctx.arc(bx, by, s.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();

          // 2. Gravitational Glow
          const coronaGrad = ctx.createRadialGradient(cx, cy, horizonR * 0.9, cx, cy, Math.min(width, height) * 0.48);
          coronaGrad.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
          coronaGrad.addColorStop(0.15, 'rgba(220, 220, 220, 0.25)');
          coronaGrad.addColorStop(0.4, 'rgba(160, 160, 160, 0.08)');
          coronaGrad.addColorStop(0.8, 'rgba(80, 80, 80, 0.02)');
          coronaGrad.addColorStop(1, 'transparent');
          ctx.fillStyle = coronaGrad;
          ctx.beginPath();
          ctx.arc(cx, cy, Math.min(width, height) * 0.48, 0, Math.PI * 2);
          ctx.fill();

          // 3. 3D Accretion Disk
          const diskInclination = 0.38 + currentTiltY;
          const diskRotation = currentTiltX;

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(diskRotation);

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.theta += p.speed;
            p.r += p.radialSpeed;
            if (p.r < horizonR * 1.05) {
              p.r = maxRadius * (0.85 + Math.random() * 0.15);
            }

            const cosTheta = Math.cos(p.theta);
            const sinTheta = Math.sin(p.theta);
            const px = p.r * cosTheta;
            const py = p.r * sinTheta * diskInclination + p.z;

            const dopplerBoost = 1.0 - sinTheta * 0.65;
            const alpha = Math.min(1, Math.max(0.08, p.lum * dopplerBoost * (1 - p.r / (maxRadius * 1.1))));

            const distFromCenter = Math.hypot(px, py);
            const isBehindHorizon = sinTheta < 0 && distFromCenter < horizonR * 1.08;

            if (!isBehindHorizon) {
              ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
              ctx.beginPath();
              ctx.arc(px, py, p.size * (dopplerBoost > 1 ? 1.25 : 0.9), 0, Math.PI * 2);
              ctx.fill();
            }
          }
          ctx.restore();

          // 4. Photon Sphere
          ctx.save();
          ctx.translate(cx, cy);
          const photonGrad = ctx.createRadialGradient(0, 0, horizonR * 0.95, 0, 0, photonSphereR * 1.15);
          photonGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
          photonGrad.addColorStop(0.25, 'rgba(255, 255, 255, 0.8)');
          photonGrad.addColorStop(0.6, 'rgba(200, 200, 200, 0.35)');
          photonGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

          ctx.fillStyle = photonGrad;
          ctx.beginPath();
          ctx.arc(0, 0, photonSphereR * 1.15, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.lineWidth = 1.5;
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 15;
          ctx.beginPath();
          ctx.arc(0, 0, horizonR * 1.04, 0, Math.PI * 2);
          ctx.stroke();
          ctx.shadowBlur = 0;

          // 5. Event Horizon
          ctx.fillStyle = '#000000';
          ctx.beginPath();
          ctx.arc(0, 0, horizonR, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(0, -horizonR * 0.3, horizonR * 1.35, horizonR * 0.45, 0, Math.PI, Math.PI * 2);
          ctx.stroke();

          ctx.restore();
        };

        animId = requestAnimationFrame(render);

        return () => {
          isDisposed = true;
          cancelAnimationFrame(animId);
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('resize', onResize);
        };
      }, []);

      return (
        <div className="relative h-full w-full overflow-hidden bg-black">
          <canvas ref={canvasRef} className="block h-full w-full touch-none" />
        </div>
      );
    }

    // --- Component: Interactive MapReduce Word Count Engine ---

      const [inputText, setInputText] = useState('Hadoop processes big data Hadoop scales out big data');

        .replace(/[^a-zA-Z0-9\s]/g, '')
        .split(/\s+/)

      const split1 = cleanTokens.slice(0, mid);

      const map1 = split1.map(w => ({ key: w, count: 1 }));

        grouped[item.key].push(1);

    // --- Component: Interactive HDFS Rack Awareness Simulator ---
    function RackSimulator({ playSound }) {
      const [mb, setMb] = useState(350);
      const [isFailing, setIsFailing] = useState(false);
      const [healed, setHealed] = useState(false);

      const blockSize = 128;
      const totalBlocks = Math.ceil(mb / blockSize);
      const blocks = [];
      let rem = mb;
      for (let i = 1; i <= totalBlocks; i++) {
        const sz = rem >= blockSize ? blockSize : rem;
        blocks.push({ id: `Blk_${i}`, size: sz });
        rem -= sz;
      }

      const triggerCrash = () => {
        if (isFailing) return;
        setIsFailing(true);
        setHealed(false);
        playSound('alert');

        setTimeout(() => {
          playSound('success');
          setHealed(true);
          setTimeout(() => setIsFailing(false), 3500);
        }, 2500);
      };

      return (
        <div className="glass-panel p-6 sm:p-8 rounded-2xl border border-white/20 bg-black/85 mb-16 shadow-[0_10px_30px_rgba(0,0,0,0.8)]">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <div>
              <h4 className="text-2xl font-bold text-white flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-white shadow-[0_0_8px_#ffffff]"></span>
                HDFS Rack Awareness & Replication Playground
              </h4>
              <p className="text-sm text-neutral-400 mt-1">
                <strong>Rule:</strong> Replica 1 on Local Node • Replica 2 on Remote Rack Node • Replica 3 on Alternate Node in Remote Rack.
              </p>
            </div>
            <button
              onClick={triggerCrash}
              disabled={isFailing}
              className="px-4 py-2.5 rounded-xl bg-neutral-900 hover:bg-neutral-800 border border-white/30 text-white text-xs font-semibold flex items-center gap-2 transition disabled:opacity-50 font-mono shadow-[0_0_15px_rgba(255,255,255,0.15)]"
            >
              <span>{isFailing ? 'Simulating Fault...' : 'Simulate Node Failure'}</span>
            </button>
          </div>

          <div className="bg-black/90 p-4 rounded-xl border border-white/15 mb-6 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center gap-3">
              <label className="text-xs font-mono text-neutral-300">File Size (MB):</label>
              <input
                type="number"
                value={mb}
                min="50"
                max="1000"
                step="50"
                onChange={(e) => setMb(parseInt(e.target.value) || 128)}
                className="w-24 px-2.5 py-1.5 rounded bg-neutral-950 border border-white/25 text-white font-mono text-xs focus:border-white outline-none"
              />
            </div>
            <div className="text-xs text-neutral-400 font-mono">
              File size <strong className="text-white">{mb} MB</strong> split into <strong className="text-white">{totalBlocks} blocks</strong> (Default: 128 MB):{' '}
              {blocks.map(b => (
                <span key={b.id} className="inline-block px-2.5 py-0.5 mx-1 bg-white/10 text-white border border-white/25 rounded text-xs font-mono">
                  {b.id}: {b.size}MB
                </span>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {/* Rack 1 */}
            <div className="p-5 rounded-2xl bg-neutral-950/80 border border-white/20">
              <div className="flex items-center justify-between mb-4 border-b border-white/15 pb-3">
                <span className="text-base font-bold text-white tracking-wide">RACK 1 (Switch A)</span>
                <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-white/10 text-neutral-300 border border-white/20">Top of Rack Switch</span>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div className="p-4 rounded-xl bg-black/90 border border-white/15">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold text-white font-mono">DataNode 1</span>
                    <span className="w-2 h-2 rounded-full bg-white shadow-[0_0_6px_#fff]"></span>
                  </div>
                  <div className="space-y-1">
                    <span className="block px-2 py-1 bg-white/15 border border-white/40 text-white rounded text-xs font-mono">Blk_1 (Replica 1)</span>
                    <span className="block px-2 py-1 bg-white/10 border border-white/25 text-neutral-300 rounded text-xs font-mono">Blk_3 (Replica 1)</span>
                  </div>
                </div>
                <div className="p-4 rounded-xl bg-black/90 border border-white/15">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold text-white font-mono">DataNode 2</span>
                    <span className="w-2 h-2 rounded-full bg-white shadow-[0_0_6px_#fff]"></span>
                  </div>
                  <div className="space-y-1">

                    <span className="block px-2 py-1 bg-white/5 border border-white/15 text-neutral-400 rounded text-xs font-mono">Blk_3 (Replica 2)</span>

                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold text-white font-mono">DataNode 3</span>
                    <span className={`w-2 h-2 rounded-full ${isFailing && !healed ? 'bg-white animate-ping' : 'bg-white shadow-[0_0_6px_#fff]'}`}></span>
                  </div>
                  <div className="space-y-1">
                    <span className="block px-2 py-1 bg-white/15 border border-white/40 text-white rounded text-xs font-mono">Blk_1 (Replica 2)</span>
                    <span className="block px-2 py-1 bg-white/10 border border-white/25 text-neutral-300 rounded text-xs font-mono">Blk_2 (Replica 2)</span>
                  </div>
                </div>
                <div className="p-4 rounded-xl bg-black/90 border border-white/15">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold text-white font-mono">DataNode 4</span>
                    <span className="w-2 h-2 rounded-full bg-white shadow-[0_0_6px_#fff]"></span>
                  </div>
                  <div className="space-y-1">
                    <span className="block px-2 py-1 bg-white/15 border border-white/40 text-white rounded text-xs font-mono">Blk_1 (Replica 3)</span>
                    <span className="block px-2 py-1 bg-white/10 border border-white/25 text-neutral-300 rounded text-xs font-mono">Blk_2 (Replica 3)</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div className="text-sm font-mono mt-4 text-center">
            {isFailing && !healed ? (
              <span className="text-white font-bold animate-pulse">⚠️ DataNode 3 heartbeat lost! Under-replicated blocks detected. NameNode initiating auto-recovery...</span>
            ) : healed ? (
              <span className="text-white font-bold">✓ Self-healing complete! NameNode commanded DataNode 4 to copy Blk_1 to DataNode 2. Cluster back at 3x replication factor!</span>
            ) : (
              <span className="text-neutral-300">✓ All blocks safely replicated 3x across 2 independent racks according to HDFS Rack Awareness policy.</span>
            )}
          </div>
        </div>
      );
    }

        if (next) playTechSound('success', true);
      };

      // Scroll Spy & Progress
      useEffect(() => {
        const onScroll = () => {
          const st = window.scrollY;
          const dh = document.documentElement.scrollHeight - window.innerHeight;
          if (dh > 0) setProgress((st / dh) * 100);

          const pos = st + 220;
          for (let i = sections.length - 1; i >= 0; i--) {
            const el = document.getElementById(sections[i]);
            if (el && el.offsetTop <= pos) {
              setActiveNav(sections[i]);
              setCurrentSlide(i);
              break;
            }
          }
        };
        window.addEventListener('scroll', onScroll);
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      // Advanced Holographic 3D Tilt Card Effect with Cursor Glare
      useEffect(() => {
        const cards = document.querySelectorAll('.tilt-card');
        const onMove = (e) => {
          const card = e.currentTarget;
          const r = card.getBoundingClientRect();
          const x = e.clientX - r.left;
          const y = e.clientY - r.top;
          const rx = ((y - r.height / 2) / (r.height / 2)) * -9;
          const ry = ((x - r.width / 2) / (r.width / 2)) * 9;
          card.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg) scale3d(1.025, 1.025, 1.025)`;

          let glare = card.querySelector('.tilt-glare');
          if (!glare) {
            glare = document.createElement('div');
            glare.className = 'tilt-glare';
            card.appendChild(glare);
          }
          glare.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(255, 255, 255, 0.2), transparent 60%)`;
        };

        const onLeave = (e) => {
          e.currentTarget.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
        };

        cards.forEach(c => {
          c.addEventListener('mousemove', onMove);
          c.addEventListener('mouseleave', onLeave);
        });

        return () => {
          cards.forEach(c => {
            c.removeEventListener('mousemove', onMove);
            c.removeEventListener('mouseleave', onLeave);
          });
        };
      }, []);

      const goToSlide = (idx) => {
        if (idx >= 0 && idx < sections.length) {
          setCurrentSlide(idx);
          const el = document.getElementById(sections[idx]);
